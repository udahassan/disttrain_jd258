[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "udahassan-disttrain_jd258"
version = "0.1.0"
description = "通过字符级与结构级特征识别分布式训练框架工程师·模型热切换的一致性的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "udahassan" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://udahassan.github.io"
Repository = "https://github.com/udahassan/disttrain_jd258"
Issues = "https://github.com/udahassan/disttrain_jd258/issues"

[project.scripts]
disttrain_jd258 = "disttrain_jd258:main"

[tool.setuptools]
py-modules = ["disttrain_jd258"]
